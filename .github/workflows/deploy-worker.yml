name: Deploy Telemetry Worker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      skip_migration:
        description: 'Skip D1 schema apply (deploy code only)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Apply D1 Migrations
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.skip_migration != 'true' }}
        run: npx wrangler d1 migrations apply pphat-telemetry --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test /health
        if: ${{ vars.WORKER_URL != '' }}
        run: |
          echo "Probing ${{ vars.WORKER_URL }}/health"
          curl -fsS "${{ vars.WORKER_URL }}/health"
